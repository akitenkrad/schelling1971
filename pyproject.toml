[project]
name = "schelling1971-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "schelling-tools",
]

[tool.uv.workspace]
members = ["tools"]

[tool.uv.sources]
schelling-tools = { workspace = true }
# rs-runvault is the source of truth for reading and writing run directories. Use a Git
# dependency because a path dependency would tie this project to the development machine's directory layout.
runvault = { git = "https://github.com/akitenkrad/rs-runvault", subdirectory = "python" }

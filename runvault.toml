# What each metric measures (runvault declaration; rs-runvault docs/metrics.ja.md).
#
# `Run::start` reads this file, and `finish()` copies entries into the run's `metrics.meta.json`
# only for names actually recorded by that run. The names must match those written by
# `simulation/src/record.rs`.
#
# `direction` means "which is better," not "which is larger." Segregation strength describes the
# model rather than its performance, so it is set to `none`: Schelling's claim is that segregation
# arises even from mild preferences, not that segregation is desirable. Explicit `none` records a
# deliberate decision, distinguishing it from "undecided" (omitting the field).

[metrics."avg_same_ratio"]
meaning   = "Mean same-color neighbor ratio across all agents. It is near the group proportion (≈0.5) under random placement and reaches 0.6–0.9 at convergence."
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."avg_same_ratio_a"]
meaning   = "Mean same-color neighbor ratio for group A. Indicates whether segregation strength is asymmetric between groups."
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."avg_same_ratio_b"]
meaning   = "Mean same-color neighbor ratio for group B."
unit      = "ratio"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."pct_no_opposite"]
meaning   = "Percentage of agents with no opposite-color neighbors. Indicates how many same-color-only clusters have formed."
unit      = "percent"
direction = "none"
range     = [0.0, 100.0]
scope     = ["run"]

[metrics."dissimilarity_index"]
meaning   = "Simplified dissimilarity index D, treating the entire grid as one area: D = 0.5 × |a/A − b/B|. It is ≈0 when the groups are equal in size."
unit      = "ratio"
direction = "none"
range     = [0.0, 0.5]
scope     = ["run"]

[metrics."n_dissatisfied"]
meaning   = "Number of agents classified as dissatisfied at the start of the step. Convergence occurs when this reaches 0."
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."n_moved"]
meaning   = "Number of agents that actually moved during the step. The simulation stops if this reaches 0 because no destination can be found."
unit      = "count"
direction = "none"
scope     = ["run"]

[metrics."converged"]
meaning   = "1 if the simulation ended by convergence, or 0 if it was truncated. Convergence means that no dissatisfied agents remain."
unit      = "boolean"
direction = "none"
range     = [0.0, 1.0]
scope     = ["run"]

[metrics."final_iteration"]
meaning   = "Number of steps completed when the simulation stopped."
unit      = "count"
direction = "none"
scope     = ["run"]

# --- Descriptions of conditions (parameters) ---------------------------------
#
# Keys are JSON Pointers relative to `/parameters` in `config.json`.

[parameters."/rows"]
meaning = "Number of grid rows."
unit    = "count"

[parameters."/cols"]
meaning = "Number of grid columns."
unit    = "count"

[parameters."/n_a"]
meaning = "Number of agents in group A (0 selects a value automatically from the grid size and vacancy rate)."
unit    = "count"

[parameters."/n_b"]
meaning = "Number of agents in group B."
unit    = "count"

[parameters."/n_vacant"]
meaning = "Number of vacant cells. Because agents can move only to these cells, this affects how far segregation can progress."
unit    = "count"

[parameters."/vacant_rate"]
meaning = "Vacancy rate used to determine n_a and n_b automatically."
range   = [0.0, 1.0]

[parameters."/threshold"]
meaning = "Tolerance limit τ. An agent is dissatisfied when its same-color neighbor ratio is below this value (input to the ratio rule when `--rule` is omitted)."
range   = [0.0, 1.0]

[parameters."/rule"]
meaning = "Satisfaction rule: `ratio:X` (segregation form), `min-same:N` (congregation form, Fig.16), or `bounded:L:H` (integration form, Fig.17)."

[parameters."/rule_kind"]
meaning = "Rule type extracted from the rule above (`ratio`, `min-same`, or `bounded`)."

[parameters."/min_same"]
meaning = "Lower bound N for the congregation rule; null because it has no meaning for other rules."
unit    = "count"

[parameters."/max_same"]
meaning = "Upper bound for the integration rule; null for other rules."
unit    = "count"

[parameters."/move_mode"]
meaning = "Movement mode. `standard` is a loose mode in which only dissatisfied agents move; in `strict`, satisfied agents may also move speculatively to a vacancy that strictly improves their same-color ratio (Fig.8)."

[parameters."/move_strategy"]
meaning = "Destination-selection strategy. `nearest` chooses the first satisfactory vacancy at the shortest distance; `best-local` chooses the vacancy with the highest post-move same-color ratio in the nearest distance band (improving the minority cluster ratio for unequal numbers in Fig.12)."

[parameters."/max_iterations"]
meaning = "Maximum number of iterations; the simulation stops here even if it has not converged."
unit    = "count"

[parameters."/snapshot_interval"]
meaning = "Interval in steps between grid snapshots (0 disables snapshots). This controls the amount of recorded data, not the result."
unit    = "count"

[parameters."/seed"]
meaning = "Random seed. Only the initial placement and activation order are random; destination selection uses no randomness."

[parameters."/command"]
meaning = "Subcommand that recorded these conditions."

[parameters."/seeds"]
meaning = "Sequence of seeds used by the sweep. The parent run is driven by this list and therefore has no single random seed."

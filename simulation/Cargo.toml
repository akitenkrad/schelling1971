[package]
name = "schelling-simulation"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "schelling"
path = "src/main.rs"

[dependencies]
rand        = { version = "0.8", features = ["small_rng"] }
csv         = "1.3"
serde       = { version = "1.0", features = ["derive"] }
clap        = { version = "4.5", features = ["derive"] }
chrono      = "0.4"
serde_json  = "1.0"

# social-simulation framework (socsim) — engine foundation for grid ABMs.
# Git dependency. The specific commit is pinned in Cargo.lock.
socsim-core   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-core" }
socsim-engine = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-engine" }
socsim-grid   = { git = "https://github.com/akitenkrad/rs-social-simulation-tools", branch = "main", package = "socsim-grid" }

# runvault — experiment-recording foundation containing the run directory, config.json, metrics.csv, and manifest.
# Git dependency. The specific commit is pinned in Cargo.lock.
runvault = { git = "https://github.com/akitenkrad/rs-runvault", branch = "main" }
